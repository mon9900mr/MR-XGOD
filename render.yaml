services:
  - type: web
    name: masterxgod-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend/steam-auth
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FRONTEND_URL
        value: https://mon9900mr.github.io
      - key: FRONTEND_REDIRECT_URL
        value: https://mon9900mr.github.io/MR-XGOD/
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
