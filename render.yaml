services:
  - type: web
    name: masterxgod-api
    runtime: node
    plan: free
    rootDir: backend/steam-auth
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FRONTEND_URL
        value: https://mon9900mr.github.io/MR-XGOD
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: MASTERXGOD
      - key: ADMIN_PASSWORD
        sync: false
