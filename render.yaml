services:
  - type: web
    name: masterxgod-steam-auth
    runtime: node
    plan: free
    rootDir: backend/steam-auth
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FRONTEND_URL
        value: https://mon9900mr.github.io/MR-XGOD/
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_SECRET
        generateValue: true
      - key: STEAM_API_KEY
        sync: false
